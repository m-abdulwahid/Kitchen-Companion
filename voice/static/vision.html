<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision test</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fff6ec; --card: #ffffff; --ink: #3d2418; --muted: #8a6a58; --line: #f0dccb;
    --accent: #e85d4c; --accent-ink: #ffffff; --ok: #2f8a4f; --bad: #b3261e; --chip: #fde8d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1410; --card: #2a1d17; --ink: #f6e6d8; --muted: #b99a86; --line: #3f2c22;
            --accent: #f0705f; --accent-ink: #1d1410; --ok: #6fcf8f; --bad: #ff8a80; --chip: #3f2c22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  h2 { margin: 0 0 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  video { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; object-fit: cover; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; }
  select, input[type=text] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  input[type=text] { flex: 1 1 260px; }
  button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 16px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { color: var(--muted); font-size: .9rem; min-height: 1.4em; margin: 10px 0 0; }
  .status.bad { color: var(--bad); }
  .live { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .live.on { background: var(--bad); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .now .seen { font-size: 1.15rem; font-weight: 600; margin: 0 0 8px; overflow-wrap: anywhere; }
  .now .feedback { margin: 0; overflow-wrap: anywhere; }
  .verdict { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); margin-bottom: 8px; }
  .verdict.pass { background: var(--ok); color: var(--accent-ink); }
  .verdict.fail { background: var(--bad); color: var(--accent-ink); }
  .empty { color: var(--muted); margin: 0; }
  ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-height: 60vh; overflow-y: auto; }
  ol.log li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  ol.log li:first-child { border-top: 0; padding-top: 0; }
  ol.log img { width: 96px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; display: block; }
  .meta { color: var(--muted); font-size: .8rem; }
  .entry p { margin: 2px 0 0; overflow-wrap: anywhere; }
  .entry .err { color: var(--bad); }
  code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .9em; background: var(--chip); padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Vision test</h1>
  <p class="sub">Shows what the camera sees and what the coach says about it. While it runs, a photo goes to Omni every few seconds. Times are your local clock, so you can line them up with a recording.</p>

  <div class="layout">
    <section>
      <div class="panel">
        <video id="video" autoplay playsinline muted></video>
        <p class="status" id="status" role="status">Camera is off. Press Start.</p>
        <div class="row">
          <button id="toggle" class="primary" type="button">Start</button>
          <button id="sendNow" type="button" disabled>Send one now</button>
          <span class="meta"><span class="live" id="live"></span><span id="count">0 sent</span></span>
        </div>
        <div class="row">
          <label for="camera">Camera</label>
          <select id="camera"><option value="">Default</option></select>
          <label for="every">Every</label>
          <select id="every">
            <option value="2">2 s</option><option value="3" selected>3 s</option>
            <option value="5">5 s</option><option value="10">10 s</option>
          </select>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="onlyChange" checked> Only send when the picture changes</label>
          <label class="check"><input type="checkbox" id="usePrev" checked> Also send the previous photo</label>
        </div>
        <div class="row">
          <label for="step">Recipe step</label>
          <input type="text" id="step" maxlength="600" placeholder="Leave empty to just watch and comment">
        </div>
      </div>
    </section>

    <section>
      <div class="panel now" aria-live="polite">
        <h2>Coach says</h2>
        <div id="coach"><p class="empty">Nothing yet.</p></div>
      </div>
      <div class="panel">
        <h2>History</h2>
        <ol class="log" id="log"></ol>
      </div>
    </section>
  </div>
</main>

<script>
const MAX_SENT = 200;            // stop by itself after this many photos, so a forgotten tab cannot burn the API budget
const FRAME_WIDTH = 640;
const CHANGE_LIMIT = 5;          // mean brightness difference (0-255) between thumbnails that counts as "the picture changed"
const $ = (id) => document.getElementById(id);

const video = $("video");
let stream = null, timer = null, busy = false, sent = 0, failures = 0;
let lastSentThumb = null, lastSentImage = "";
const recent = [];               // what the coach said lately, sent back so it does not repeat itself

function setStatus(text, bad = false) {
  $("status").textContent = text;
  $("status").classList.toggle("bad", bad);
}

function clock() {
  return new Date().toLocaleTimeString([], { hour12: false });
}

async function listCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const select = $("camera");
  const chosen = select.value;
  select.replaceChildren(new Option("Default", ""));
  devices.filter((d) => d.kind === "videoinput").forEach((d, i) => {
    select.append(new Option(d.label || `Camera ${i + 1}`, d.deviceId));
  });
  select.value = chosen;
}

async function openCamera() {
  closeCamera();
  const deviceId = $("camera").value;
  stream = await navigator.mediaDevices.getUserMedia({
    video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1280 } },
    audio: false,
  });
  video.srcObject = stream;
  await listCameras();  // labels only appear once the camera is allowed
}

function closeCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
}

/** The current frame as a JPEG data URI plus a tiny grayscale copy for spotting changes. */
function grabFrame() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return null;
  const canvas = document.createElement("canvas");
  canvas.width = Math.min(FRAME_WIDTH, w);
  canvas.height = Math.round(canvas.width * h / w);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const image = canvas.toDataURL("image/jpeg", 0.7);

  const small = document.createElement("canvas");
  small.width = 32; small.height = 24;
  const sctx = small.getContext("2d", { willReadFrequently: true });
  sctx.drawImage(canvas, 0, 0, 32, 24);
  const px = sctx.getImageData(0, 0, 32, 24).data;
  const thumb = new Uint8Array(32 * 24);
  for (let i = 0; i < thumb.length; i++) {
    thumb[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
  }
  return { image, thumb };
}

function difference(a, b) {
  let total = 0;
  for (let i = 0; i < a.length; i++) total += Math.abs(a[i] - b[i]);
  return total / a.length;
}

function addLogEntry(image, lines, isError) {
  const li = document.createElement("li");
  const img = document.createElement("img");
  img.src = image;
  img.alt = "Photo sent at " + lines.time;
  const box = document.createElement("div");
  box.className = "entry";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = lines.time + (lines.ms ? " · " + (lines.ms / 1000).toFixed(1) + " s" : "");
  box.append(meta);
  for (const text of lines.body) {
    const p = document.createElement("p");
    p.textContent = text;
    if (isError) p.className = "err";
    box.append(p);
  }
  li.append(img, box);
  $("log").prepend(li);
}

function showNow(result) {
  const box = $("coach");
  box.replaceChildren();
  if (result.passed !== null) {
    const badge = document.createElement("span");
    badge.className = "verdict " + (result.passed ? "pass" : "fail");
    badge.textContent = result.passed ? "Step looks good" : "Not there yet";
    box.append(badge);
  }
  const seen = document.createElement("p");
  seen.className = "seen";
  seen.textContent = result.seen || "(no description)";
  const feedback = document.createElement("p");
  feedback.className = "feedback";
  feedback.textContent = result.feedback;
  box.append(seen, feedback);
}

async function check(force) {
  if (busy || !stream) return;
  const frame = grabFrame();
  if (!frame) { setStatus("Camera is still starting..."); return; }

  if (!force && $("onlyChange").checked && lastSentThumb) {
    const change = difference(frame.thumb, lastSentThumb);
    if (change < CHANGE_LIMIT) {
      setStatus(`Picture unchanged (${change.toFixed(1)} < ${CHANGE_LIMIT}), not sent. Last check ${clock()}.`);
      return;
    }
  }

  busy = true;
  setStatus("Asking the coach...");
  const previous = $("usePrev").checked ? lastSentImage : "";
  const started = performance.now();
  try {
    const response = await fetch("/api/vision/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        image: frame.image,
        previous_image: previous || null,
        step: $("step").value.trim() || null,
        recent,
      }),
    });
    if (!response.ok) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.detail || "HTTP " + response.status);
    }
    const result = await response.json();
    sent++;
    failures = 0;
    lastSentThumb = frame.thumb;
    lastSentImage = frame.image;
    recent.push(result.feedback);
    if (recent.length > 3) recent.shift();
    $("count").textContent = sent + " sent";
    showNow(result);
    const body = [];
    if (result.passed !== null) body.push(result.passed ? "PASS" : "NOT YET");
    body.push("Sees: " + (result.seen || "?"), "Says: " + result.feedback);
    addLogEntry(frame.image, { time: clock(), ms: performance.now() - started, body }, false);
    setStatus(`Last check ${clock()}.`);
    if (sent >= MAX_SENT) { stop(); setStatus(`Stopped after ${MAX_SENT} photos. Press Start to go on.`); }
  } catch (error) {
    failures++;
    addLogEntry(frame.image, { time: clock(), ms: 0, body: [String(error.message || error)] }, true);
    setStatus("That check failed: " + (error.message || error), true);
    if (failures >= 3) { stop(); setStatus("Stopped after 3 failures in a row: " + (error.message || error), true); }
  } finally {
    busy = false;
  }
}

async function start() {
  try {
    await openCamera();
  } catch (error) {
    setStatus("Could not open the camera: " + (error.message || error), true);
    return;
  }
  sent = 0; failures = 0; lastSentThumb = null; lastSentImage = "";
  $("count").textContent = "0 sent";
  $("toggle").textContent = "Stop";
  $("sendNow").disabled = false;
  $("live").classList.add("on");
  setStatus("Camera on. First photo coming up...");
  schedule();
  check(true);
}

function schedule() {
  clearInterval(timer);
  timer = setInterval(() => check(false), Number($("every").value) * 1000);
}

function stop() {
  clearInterval(timer);
  timer = null;
  closeCamera();
  $("toggle").textContent = "Start";
  $("live").classList.remove("on");
  $("sendNow").disabled = true;
  setStatus("Camera is off. Press Start.");
}

$("toggle").addEventListener("click", () => (timer ? stop() : start()));
$("sendNow").addEventListener("click", () => check(true));
$("every").addEventListener("change", () => { if (timer) schedule(); });
$("camera").addEventListener("change", async () => {
  if (!timer) return;
  try { await openCamera(); } catch (error) { setStatus("Could not switch camera: " + (error.message || error), true); }
});
window.addEventListener("pagehide", closeCamera);
</script>
</body>
</html>
